# Variables que encienden Eureka y Config Server en cada microservicio.
# Fuera de Docker (un servicio solo) estan apagadas por defecto y el servicio arranca igual.
x-infra-env: &infra-env
  EUREKA_ENABLED: "true"
  EUREKA_URL: http://eureka-server:8081/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  CONFIG_ENABLED: "true"
  CONFIG_URL: http://config-server:8888

# Autenticacion (JWT). Apagada por defecto: no cambia nada hasta que un archivo .env (que NO se versiona, ver
# .env.example) ponga AUTH_ENABLED=true y un JWT_SECRET de al menos 32 caracteres. Guia: docs/AUTENTICACION.md
x-auth-env: &auth-env
  AUTH_ENABLED: ${AUTH_ENABLED:-false}
  JWT_SECRET: ${JWT_SECRET:-}

x-infra-deps: &infra-deps
  eureka-server:
    condition: service_healthy
  config-server:
    condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=40"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  eureka-server:
    build: ./services/eureka-server
    ports:
      - "8081:8081"
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081"]
      interval: 5s
      timeout: 3s
      retries: 20

  config-server:
    build: ./services/config-server
    ports:
      - "8888:8888"
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8888"]
      interval: 5s
      timeout: 3s
      retries: 20

  servicio-tickets:
    build: ./services/servicio-tickets
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      <<: [*infra-env, *auth-env]
      DB_URL: jdbc:postgresql://db:5432/tickets_db
      DB_USUARIO: tickets
      DB_CLAVE: tickets
    depends_on:
      <<: *infra-deps
      db:
        condition: service_healthy
    mem_limit: 320m

  servicio-identidad:
    build: ./services/servicio-identidad
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      <<: [*infra-env, *auth-env]
      DB_URL: jdbc:postgresql://db:5432/identidad_db
      DB_USUARIO: identidad
      DB_CLAVE: identidad
      ADMIN_USUARIO: ${ADMIN_USUARIO:-}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
    depends_on:
      <<: *infra-deps
      db:
        condition: service_healthy
    mem_limit: 320m

  servicio-comunicacion:
    build: ./services/servicio-comunicacion
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      <<: [*infra-env, *auth-env]
      DB_URL: jdbc:postgresql://db:5432/comunicacion_db
      DB_USUARIO: comunicacion
      DB_CLAVE: comunicacion
      ADJUNTOS_DIR: /app/adjuntos
    volumes:
      - adjuntos:/app/adjuntos
    depends_on:
      <<: *infra-deps
      db:
        condition: service_healthy
    mem_limit: 320m

  servicio-estadisticas:
    build: ./services/servicio-estadisticas
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      <<: [*infra-env, *auth-env]
      DB_URL: jdbc:postgresql://db:5432/estadisticas_db
      DB_USUARIO: estadisticas
      DB_CLAVE: estadisticas
    depends_on:
      <<: *infra-deps
      db:
        condition: service_healthy
    mem_limit: 320m

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Deja registrado el servidor con las 4 bases al arrancar (sin crearlo a mano).
      PGADMIN_SERVER_JSON_FILE: /pgadmin-config/servers.json
    volumes:
      - ./docker/pgadmin:/pgadmin-config:ro
    ports:
      - "5055:80"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

volumes:
  datos:
  adjuntos:
