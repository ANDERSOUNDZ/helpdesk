services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: comunicacion_db
      POSTGRES_USER: comunicacion
      POSTGRES_PASSWORD: comunicacion
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunicacion -d comunicacion_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://db:5432/comunicacion_db
      DB_USUARIO: comunicacion
      DB_CLAVE: comunicacion
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 320m

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5054:80"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

volumes:
  datos:
