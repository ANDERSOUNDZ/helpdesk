spring.application.name=servicio-comunicacion
server.port=8084
spring.web.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/comunicacion_db}
spring.datasource.username=${DB_USUARIO:comunicacion}
spring.datasource.password=${DB_CLAVE:comunicacion}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_CONEXIONES:3}
