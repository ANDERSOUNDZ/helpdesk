spring.application.name=servicio-comunicacion
server.port=8084
spring.web.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/comunicacion_db}
spring.datasource.username=${DB_USUARIO:comunicacion}
spring.datasource.password=${DB_CLAVE:comunicacion}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_CONEXIONES:3}

app.adjuntos.directorio=${ADJUNTOS_DIR:./datos/adjuntos}
app.adjuntos.max-tamano-bytes=${ADJUNTOS_MAX_BYTES:5242880}
app.adjuntos.max-archivos=${ADJUNTOS_MAX_ARCHIVOS:3}
app.adjuntos.tipos-permitidos=${ADJUNTOS_TIPOS:image/png,image/jpeg,application/pdf}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Descubrimiento (Eureka) y configuracion centralizada (Config Server), como en smart-parking.
# Apagados por defecto: asi este servicio se levanta solo, sin esos servidores. docker-compose los enciende.
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8081/eureka/}
spring.cloud.config.enabled=${CONFIG_ENABLED:false}
spring.config.import=optional:configserver:${CONFIG_URL:http://localhost:8888}
