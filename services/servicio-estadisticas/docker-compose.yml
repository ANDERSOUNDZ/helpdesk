services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estadisticas_db
      POSTGRES_USER: estadisticas
      POSTGRES_PASSWORD: estadisticas
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estadisticas -d estadisticas_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://db:5432/estadisticas_db
      DB_USUARIO: estadisticas
      DB_CLAVE: estadisticas
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 320m

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5052:80"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

volumes:
  datos:
