spring.application.name=servicio-estadisticas
server.port=8082
spring.web.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/estadisticas_db}
spring.datasource.username=${DB_USUARIO:estadisticas}
spring.datasource.password=${DB_CLAVE:estadisticas}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_CONEXIONES:3}
