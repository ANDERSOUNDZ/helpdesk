spring.application.name=servicio-identidad
server.port=8083
spring.web.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/identidad_db}
spring.datasource.username=${DB_USUARIO:identidad}
spring.datasource.password=${DB_CLAVE:identidad}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_CONEXIONES:3}

# Descubrimiento (Eureka) y configuracion centralizada (Config Server), como en smart-parking.
# Apagados por defecto: asi este servicio se levanta solo, sin esos servidores. docker-compose los enciende.
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8081/eureka/}
spring.cloud.config.enabled=${CONFIG_ENABLED:false}
spring.config.import=optional:configserver:${CONFIG_URL:http://localhost:8888}

# Salud: solo se expone /actuator/health (sin detalles). Eureka usa este estado en vez de marcar siempre UP.
management.endpoints.web.exposure.include=health
eureka.client.healthcheck.enabled=true
