spring.application.name=servicio-identidad
server.port=8083
spring.web.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/identidad_db}
spring.datasource.username=${DB_USUARIO:identidad}
spring.datasource.password=${DB_CLAVE:identidad}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_CONEXIONES:3}
