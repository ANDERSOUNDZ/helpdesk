services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tickets_db
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/tickets_db
      DB_USUARIO: tickets
      DB_CLAVE: tickets
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 320m

volumes:
  datos:
