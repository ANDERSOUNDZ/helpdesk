spring.application.name=servicio-tickets
server.port=8080
spring.web.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tickets_db}
spring.datasource.username=${DB_USUARIO:tickets}
spring.datasource.password=${DB_CLAVE:tickets}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_CONEXIONES:3}
